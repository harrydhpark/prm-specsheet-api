<html lang="ko">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 TV Product Profile (v1.6 ??)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --lge-red: #C40030;
      --lge-red-hover: #A00027;
      --primary-slate: #0F172A;
      --secondary-slate: #1E293B;
      --accent-teal: #0D9488;
      --accent-blue: #3B82F6;
      --bg-canvas: #090D16;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --font-headline: 'IBM Plex Sans', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background-color: var(--bg-canvas);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Intranet Security Header */
    .pub-header {
      height: 56px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      backdrop-filter: blur(12px);
      z-index: 100;
    }
    .pub-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .pub-logo {
      background: var(--lge-red);
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      padding: 4px 10px;
      border-radius: 4px;
      letter-spacing: 1px;
    }
    .pub-title-box h1 {
      font-family: var(--font-headline);
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }
    .pub-title-box p {
      font-size: 12px;
      color: var(--text-muted);
    }
    .pub-security-tag {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(196, 0, 48, 0.15);
      border: 1px solid rgba(196, 0, 48, 0.4);
      color: #FF6B81;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    /* Dual Tab Navigation Header */
    .tab-bar {
      display: flex;
      background: #0F172A;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0 24px;
      gap: 16px;
    }
    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-headline);
      font-size: 14px;
      font-weight: 600;
      padding: 14px 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
    }
    .tab-btn:hover {
      color: #fff;
    }
    .tab-btn.active {
      color: #fff;
      border-bottom-color: var(--lge-red);
      background: rgba(196, 0, 48, 0.08);
    }
    .tab-btn .badge-count {
      background: rgba(255, 255, 255, 0.15);
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 10px;
      color: #fff;
    }
    .tab-btn.active .badge-count {
      background: var(--lge-red);
    }

    /* Main Container */
    .pub-body {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* Slide View Tab Layout */
    .slide-tab-content {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* Smart TOC Sidebar */
    .pub-sidebar {
      width: 320px;
      background: #0D1322;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .toc-header {
      padding: 16px 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--accent-teal);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      text-transform: uppercase;
    }
    .toc-section {
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    .toc-section-title {
      padding: 12px 20px 8px;
      font-size: 13px;
      font-weight: 700;
      color: #E2E8F0;
    }
    .toc-slide-item {
      padding: 8px 20px 8px 36px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
    }
    .toc-slide-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
    }
    .toc-slide-item.active {
      background: rgba(196, 0, 48, 0.15);
      color: #fff;
      font-weight: 600;
      border-left: 3px solid var(--lge-red);
    }

    /* Main Slide Canvas */
    .pub-canvas {
      flex: 1;
      background: radial-gradient(circle at 50% 30%, #151F33 0%, #080C14 100%);
      display: flex;
      flex-direction: column;
      padding: 32px;
      overflow-y: auto;
      position: relative;
    }
    .slide-card-wrapper {
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      backdrop-filter: blur(16px);
      min-height: 520px;
      display: flex;
      flex-direction: column;
    }
    .slide-badge {
      display: inline-block;
      align-self: flex-start;
      background: rgba(13, 148, 136, 0.2);
      border: 1px solid var(--accent-teal);
      color: #2DD4BF;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    .slide-title {
      font-family: var(--font-headline);
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 24px;
      line-height: 1.3;
    }
    .slide-content-bullets {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 32px;
    }
    .slide-content-bullets li {
      position: relative;
      padding-left: 24px;
      font-size: 16px;
      color: #CBD5E1;
      line-height: 1.6;
    }
    .slide-content-bullets li::before {
      content: '■';
      position: absolute;
      left: 0;
      color: var(--lge-red);
      font-size: 12px;
      top: 2px;
    }

    /* Metric Grid Cards */
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: auto;
    }
    .metric-card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px 20px;
    }
    .metric-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .metric-val {
      font-family: var(--font-mono);
      font-size: 24px;
      font-weight: 700;
      color: #fff;
    }
    .metric-change {
      font-size: 11px;
      color: #34D399;
      margin-top: 4px;
    }

    /* Feature / Card Grid */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .sub-bento-card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 20px;
    }
    .sub-bento-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 10px;
    }
    .sub-bento-desc {
      font-size: 13px;
      color: #94A3B8;
      line-height: 1.5;
      white-space: pre-line;
    }

    /* Bottom Control Bar */
    .canvas-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 20px;
      max-width: 1000px;
      margin-left: auto;
      margin-right: auto;
      width: 100%;
    }
    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .nav-btn:hover {
      background: var(--lge-red);
      border-color: var(--lge-red);
    }
    .slide-counter {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-muted);
    }
    .notes-btn {
      background: rgba(13, 148, 136, 0.2);
      border: 1px solid var(--accent-teal);
      color: #2DD4BF;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Video Library Tab Layout */
    .video-tab-content {
      display: none;
      width: 100%;
      height: 100%;
      padding: 32px 40px;
      overflow-y: auto;
    }
    .video-tab-content.active {
      display: block;
    }
    .video-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .video-header-title h2 {
      font-family: var(--font-headline);
      font-size: 22px;
      font-weight: 700;
      color: #fff;
    }
    .video-header-title p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .video-filter-bar {
      display: flex;
      gap: 10px;
    }
    .filter-chip {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94A3B8;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-chip.active, .filter-chip:hover {
      background: var(--lge-red);
      color: #fff;
      border-color: var(--lge-red);
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }
    .video-card {
      background: #0D1322;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .video-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      border-color: rgba(196, 0, 48, 0.5);
    }
    .video-thumb-box {
      position: relative;
      width: 100%;
      height: 180px;
      overflow: hidden;
      background: #000;
    }
    .video-thumb-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.85;
      transition: transform 0.3s;
    }
    .video-card:hover .video-thumb-img {
      transform: scale(1.05);
      opacity: 1;
    }
    .play-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      background: rgba(196, 0, 48, 0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .duration-badge {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(0,0,0,0.8);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 4px;
    }
    .video-info-box {
      padding: 18px;
    }
    .video-cat {
      font-size: 11px;
      color: var(--accent-teal);
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .video-card-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .video-card-desc {
      font-size: 12px;
      color: #94A3B8;
      line-height: 1.5;
    }

    /* Video Player Modal */
    .video-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .video-modal.active {
      display: flex;
    }
    .modal-content {
      background: #0F172A;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      max-width: 900px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
    }
    .modal-player-box {
      width: 100%;
      background: #000;
      aspect-ratio: 16/9;
    }
    .modal-player-box video {
      width: 100%;
      height: 100%;
      outline: none;
    }
    .modal-body {
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .modal-info h3 {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }
    .modal-info p {
      font-size: 13px;
      color: #94A3B8;
    }
    .close-modal-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    /* Speaker Notes Modal */
    .notes-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .notes-modal.active { display: flex; }
    .notes-box {
      background: #1E293B;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      max-width: 550px;
      width: 90%;
      padding: 24px;
      color: #fff;
    }
  </style>
</head>

    let currentSlideIdx = 0;

    function initSite() {
      renderTOC();
      renderSlide(0);
      renderVideoGrid('all');

      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'PageDown') nextSlide();
        if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
      });
    }

    function switchTab(tab) {
      document.getElementById('btn-slide-tab').classList.toggle('active', tab === 'slides');
      document.getElementById('btn-video-tab').classList.toggle('active', tab === 'videos');
      document.getElementById('tab-slides').style.display = tab === 'slides' ? 'flex' : 'none';
      document.getElementById('tab-videos').classList.toggle('active', tab === 'videos');
    }

    function renderTOC() {
      const container = document.getElementById('toc-list-container');
      container.innerHTML = '';

      SITE_DATA.sections.forEach(sec => {
        const secDiv = document.createElement('div');
        secDiv.className = 'toc-section';

        const secTitle = document.createElement('div');
        secTitle.className = 'toc-section-title';
        secTitle.innerText = sec.title;
        secDiv.appendChild(secTitle);

        sec.slides.forEach(sId => {
          const sIdx = SITE_DATA.slides.findIndex(s => s.id === sId);
          if (sIdx !== -1) {
            const slideObj = SITE_DATA.slides[sIdx];
            const slideItem = document.createElement('div');
            slideItem.className = 'toc-slide-item' + (sIdx === currentSlideIdx ? ' active' : '');
            slideItem.dataset.idx = sIdx;
            slideItem.innerHTML = '📄 ' + slideObj.title;
            slideItem.onclick = () => renderSlide(sIdx);
            secDiv.appendChild(slideItem);
          }
        });

        container.appendChild(secDiv);
      });
    }

    function renderSlide(idx) {
      if (idx < 0 || idx >= SITE_DATA.slides.length) return;
      currentSlideIdx = idx;

      document.querySelectorAll('.toc-slide-item').forEach(el => {
        el.classList.toggle('active', parseInt(el.dataset.idx) === idx);
      });

      const slide = SITE_DATA.slides[idx];
      const card = document.getElementById('slide-canvas-card');

      let bodyHtml = '';

      if (slide.type === 'hero' || !slide.type) {
        bodyHtml = `
          <span class="slide-badge">${slide.badge || slide.sectionTitle || 'SLIDE'}</span>
          <h2 class="slide-title">${slide.title}</h2>
          <ul class="slide-content-bullets">
            ${(slide.content || []).map(item => `<li>${item}</li>`).join('')}
          </ul>
          ${slide.metrics ? `
            <div class="metric-grid">
              ${slide.metrics.map(m => `
                <div class="metric-card">
                  <div class="metric-label">${m.label}</div>
                  <div class="metric-val">${m.value}</div>
                  <div class="metric-change">${m.change || ''}</div>
                </div>
              `).join('')}
            </div>
          ` : ''}
        `;
      } else if (slide.type === 'cards') {
        bodyHtml = `
          <span class="slide-badge">${slide.badge || 'CARD OVERVIEW'}</span>
          <h2 class="slide-title">${slide.title}</h2>
          <div class="card-grid">
            ${(slide.cards || []).map(c => `
              <div class="sub-bento-card">
                <div class="sub-bento-title">${c.title}</div>
                <div class="sub-bento-desc">${c.desc}</div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (slide.type === 'features') {
        bodyHtml = `
          <span class="slide-badge">${slide.badge || 'FEATURES'}</span>
          <h2 class="slide-title">${slide.title}</h2>
          <ul class="slide-content-bullets">
            ${(slide.content || []).map(item => `<li>${item}</li>`).join('')}
          </ul>
          ${slide.highlights ? `
            <div class="metric-grid">
              ${slide.highlights.map(h => `
                <div class="metric-card">
                  <div class="metric-label">Key Highlight</div>
                  <div class="metric-val" style="font-size:18px;">${h}</div>
                </div>
              `).join('')}
            </div>
          ` : ''}
        `;
      } else if (slide.type === 'grid' && slide.table) {
        bodyHtml = `
          <span class="slide-badge">${slide.badge || 'MATRIX'}</span>
          <h2 class="slide-title">${slide.title}</h2>
          <div style="overflow-x:auto;">
            <table style="width:100%; border-collapse:collapse; font-size:13px; color:#E2E8F0;">
              <thead>
                <tr style="background:rgba(255,255,255,0.08); text-align:left;">
                  ${slide.table.headers.map(h => `<th style="padding:12px; border-bottom:1px solid rgba(255,255,255,0.15);">${h}</th>`).join('')}
                </tr>
              </thead>
              <tbody>
                ${slide.table.rows.map(row => `
                  <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                    ${row.map(cell => `<td style="padding:12px;">${cell}</td>`).join('')}
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      card.innerHTML = bodyHtml;
      document.getElementById('slide-counter-text').innerText = `${idx + 1} / ${SITE_DATA.slides.length}`;
    }

    function prevSlide() { renderSlide(currentSlideIdx - 1); }
    function nextSlide() { renderSlide(currentSlideIdx + 1); }

    function showNotesModal() {
      const slide = SITE_DATA.slides[currentSlideIdx];
      document.getElementById('notes-modal-text').innerText = slide.notes || '이 슬라이드에 등록된 발표자 노트가 없습니다.';
      document.getElementById('notes-modal').classList.add('active');
    }
    function closeNotesModal(e) {
      if (!e || e.target === document.getElementById('notes-modal') || e.target.classList.contains('close-modal-btn')) {
        document.getElementById('notes-modal').classList.remove('active');
      }
    }

    function renderVideoGrid(cat) {
      const container = document.getElementById('video-grid-container');
      container.innerHTML = '';

      const filtered = cat === 'all' ? SITE_DATA.videos : SITE_DATA.videos.filter(v => v.category === cat);

      filtered.forEach(v => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.onclick = () => openVideoModal(v);

        card.innerHTML = `
          <div class="video-thumb-box">
            <img class="video-thumb-img" src="${v.poster}" alt="${v.title}" />
            <div class="play-overlay">▶</div>
            <div class="duration-badge">${v.duration}</div>
          </div>
          <div class="video-info-box">
            <div class="video-cat">${v.category}</div>
            <div class="video-card-title">${v.title}</div>
            <div class="video-card-desc">${v.desc}</div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function filterVideos(cat) {
      document.querySelectorAll('.filter-chip').forEach(el => {
        el.classList.toggle('active', el.innerText.includes(cat) || (cat === 'all' && el.innerText === '전체'));
      });
      renderVideoGrid(cat);
    }

    function openVideoModal(v) {
      document.getElementById('modal-video-title').innerText = v.title;
      document.getElementById('modal-video-desc').innerText = v.desc;
      const player = document.getElementById('modal-video-element');
      player.src = v.url;
      document.getElementById('video-modal').classList.add('active');
    }

    function closeVideoModal(e) {
      const player = document.getElementById('modal-video-element');
      player.pause();
      document.getElementById('video-modal').classList.remove('active');
    }

    window.onload = initSite;
  </script>
